
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoloM Services</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #10172a, #1746a2, #7438db);
      text-align: center;
    }
    main { padding: 24px; }
    h1 { font-size: clamp(36px, 7vw, 64px); margin-bottom: 12px; }
    p { color: #dbeafe; font-size: 18px; }
    .tag {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      border: 1px solid #ffffff55;
      border-radius: 30px;
      background: #ffffff15;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to SoloM Services</h1>
    <p>Secure. Simple. Built for developers.</p>
    <div class="tag">Your journey starts here.</div>
  </main>
</body>
</html>
